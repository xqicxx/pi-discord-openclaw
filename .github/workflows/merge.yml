name: AI Merge

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  ai-merge:
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'ai-approved') || (github.event.review.state == 'approved' && contains(github.event.pull_request.labels.*.name, 'ai-approved'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Merge PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Check if PR has ai-approved label
          LABELS=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels -q '.labels[].name')
          if echo "$LABELS" | grep -q 'ai-approved'; then
            echo "PR #$PR_NUMBER has ai-approved label, merging..."
            gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --delete-branch
          else
            echo "PR #$PR_NUMBER does not have ai-approved label, skipping merge."
            exit 0
          fi
