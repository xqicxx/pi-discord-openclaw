name: Gemini PR Review

on:
  # 仅手动触发（workflow_dispatch）：按需 review，不自动跑，节省 GitHub Actions
  # 免费额度（private 仓库 2000 分钟/月）。用法：
  #   gh workflow run "Gemini PR Review" -f pr_number=<PR号>
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review (leave empty = latest open PR)'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  gemini-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve PR number
        id: pr
        run: |
          if [ -n "${{ github.event.inputs.pr_number }}" ]; then
            echo "number=${{ github.event.inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            PR=$(gh pr list --repo "${{ github.repository }}" --state open --limit 1 --json number -q '.[0].number' 2>/dev/null || echo '')
            echo "number=$PR" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved PR: ${{ steps.pr.outputs.number }}"

      - name: Fetch diff
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr diff ${{ steps.pr.outputs.number }} > /tmp/pr.diff || exit 1
          wc -l /tmp/pr.diff
          echo "size=$(wc -c < /tmp/pr.diff)" >> "$GITHUB_OUTPUT"

      - name: Gemini code review
        id: review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, urllib.error

          key = os.environ['GEMINI_API_KEY']
          pr = os.environ['PR_NUMBER']
          repo = os.environ['REPO']

          diff = open('/tmp/pr.diff', encoding='utf-8', errors='replace').read()
          if len(diff) > 80000:
              diff = diff[:80000] + '\n... (diff truncated)'

          model = 'gemini-2.5-flash'
          prompt = (
              'You are a senior code reviewer. Review this GitHub pull request diff '
              '(repo: %s, PR #%s). '
              'Focus on: correctness bugs, race conditions, edge cases, error handling, '
              'regressions, and test coverage. Be precise and cite line numbers from the diff. '
              'Output in Markdown with these sections: '
              '## Summary (2-3 sentences), ## Issues (list, each with severity: CRITICAL/MAJOR/MINOR), '
              '## Suggestions, ## Verdict (APPROVE / REQUEST_CHANGES). '
              'Write the verdict in both English and Chinese (中文). '
              'If the diff is empty or trivial, say so and still give a verdict.\n\n'
              '--- DIFF START ---\n%s\n--- DIFF END ---'
          ) % (repo, pr, diff)

          url = 'https://generativelanguage.googleapis.com/v1beta/models/%s:generateContent?key=%s' % (model, key)
          body = {
              'contents': [{'role': 'user', 'parts': [{'text': prompt}]}],
              'generationConfig': {'temperature': 0.2, 'maxOutputTokens': 4096},
          }
          req = urllib.request.Request(url, data=json.dumps(body).encode(), headers={'Content-Type': 'application/json'})
          try:
              with urllib.request.urlopen(req, timeout=120) as resp:
                  data = json.load(resp)
              text = data['candidates'][0]['content']['parts'][0]['text']
          except urllib.error.HTTPError as e:
              text = 'ERROR: Gemini API failed (%s): %s' % (e.code, e.read().decode()[:300])

          open('/tmp/review.md', 'w', encoding='utf-8').write(text)

          import subprocess, datetime
          header = '🤖 **Gemini Review** (model: %s)\n\n' % model
          with open('/tmp/review.md', 'a', encoding='utf-8') as f:
              f.write('\n---\n*Generated by GitHub Actions · %s*\n' % datetime.datetime.now().isoformat())
          body = open('/tmp/review.md', encoding='utf-8').read()
          # 注：GITHUB_TOKEN 不允许 approve（GraphQL 拒绝），统一用普通 PR 评论
          subprocess.run(['gh', 'pr', 'comment', pr, '--repo', repo, '--body', header + body], check=False)
          PYEOF

      - name: Show review result
        if: always()
        run: |
          echo "--- review ---"
          head -50 /tmp/review.md 2>/dev/null || echo "(no review produced)"
