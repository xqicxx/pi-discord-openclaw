name: CI
on:
  pull_request_target:
    types: [labeled]
permissions:
  contents: read
jobs:
  test:
    if: github.event.label.name == 'ai-approved'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # pull_request_target 默认 checkout base（master）代码，必须显式取 PR head 才能测到改动
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # pi-commands 等测试运行时导入真实 pi 包，必须安装依赖
      - run: npm test
