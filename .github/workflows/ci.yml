name: CI
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
jobs:
  test:
    # 检查 PR 当前是否带 ai-approved 标签（不依赖触发事件的 label，GITHUB_TOKEN 打标的事件会被 GitHub 抑制）
    if: contains(github.event.pull_request.labels.*.name, 'ai-approved')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # pull_request_target 默认 checkout base（master）代码，必须显式取 PR head 才能测到改动
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # pi-commands 等测试运行时导入真实 pi 包，必须安装依赖
      - run: npm test
      # issue #115：typecheck 曾长期失败且 CI 未覆盖，补上防止回归
      - run: npm run typecheck
