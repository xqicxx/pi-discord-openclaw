name: CI
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  test:
    # 只在 review 通过、bot 打上 ai-approved 标签（合并前最后一刻）才跑，省 Actions 额度
    if: contains(github.event.pull_request.labels.*.name, 'ai-approved')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # pi-commands 等测试运行时导入真实 pi 包，必须安装依赖
      - run: npm test
