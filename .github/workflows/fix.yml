# AI Fixer

本仓库的自动修复流程。当 issue 被打上 worth-fixing 标签时触发。

## 前置检查

1. 用 get_issue 读取触发 issue 编号。
2. 确认它带有 worth-fixing 标签；如果没有（事件来自其他标签），用 noop 结束，不做任何事。
3. 读取 issue 全部评论，了解 triage 报告和上下文（triage 里的 Complexity/Risk 评估可参考）。
4. 用 get_repository 和 list_branches 了解仓库结构、默认分支、README 里的开发约定。

## 修复步骤

1. 分析根因：在 issue 描述的范围内，用 bash 检索代码（grep/read），定位根因，不要过度扩散。
2. 最小修复：只改与 issue 直接相关的代码；保持现有代码风格；不动无关文件。
3. 补测试：如果仓库有测试框架，为修复添加或更新测试；运行测试确认全绿（npm test 或对应命令）。
4. 提交并开 PR：创建分支 fix/issue-N-简短描述，提交信息用约定格式 fix: 描述（Issue #N）。用 create_pull_request 开 PR，标题简洁描述修复，正文说明：根因、改动、测试结果、验证方式。PR 会通过 Fixes #N 自动关联并关闭 issue。

## 不要做的

- 不重构无关代码、不升级依赖版本、不改 CI 配置（除非 issue 明确要求）。
- 不合并 PR——合并由独立的 merge 流程负责。
- 修复中途如果发现 issue 描述与代码严重不符或无法定位根因，用 update_issue 添加说明评论并把标签改为 needs-info，然后 noop。
