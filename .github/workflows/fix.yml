name: AI Fixer

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  fix:
    if: contains(github.event.label.name, 'worth-fixing')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run AI fixer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import json, os, subprocess, urllib.request, urllib.error

          key = os.environ['GEMINI_API_KEY']
          issue = os.environ['ISSUE_NUMBER']
          repo = os.environ['REPO']

          # Fetch issue details
          issue_data = json.loads(subprocess.run(
              ['gh', 'issue', 'view', issue, '--repo', repo, '--json', 'title,body'],
              capture_output=True, text=True, check=True
          ).stdout)
          title = issue_data['title']
          body = issue_data['body']

          # Fetch repo file list
          files = subprocess.run(
              ['gh', 'api', f'/repos/{repo}/git/trees/master?recursive=1', '--jq', '.tree[].path'],
              capture_output=True, text=True, check=True
          ).stdout

          model = 'gemini-2.5-flash'
          prompt = (
              'You are an expert software engineer. Fix the issue described below. '
              'Repo files: %s\n\n'
              'Issue #%s: %s\n\n%s\n\n'
              'Analyze the root cause, implement a minimal fix, and provide the diff. '
              'Output JSON with keys: analysis (root cause), files (list of {path, content} for changed files).'
          ) % (files, issue, title, body)

          url = 'https://generativelanguage.googleapis.com/v1beta/models/%s:generateContent?key=%s' % (model, key)
          req_body = {
              'contents': [{'role': 'user', 'parts': [{'text': prompt}]}],
              'generationConfig': {'temperature': 0.2, 'maxOutputTokens': 8192},
          }
          req = urllib.request.Request(url, data=json.dumps(req_body).encode(), headers={'Content-Type': 'application/json'})
          try:
              with urllib.request.urlopen(req, timeout=120) as resp:
                  data = json.load(resp)
              text = data['candidates'][0]['content']['parts'][0]['text']
          except urllib.error.HTTPError as e:
              print('Gemini API error:', e.code, e.read().decode()[:500])
              raise

          # Parse JSON from response (strip markdown fences if present)
          text = text.strip()
          if text.startswith('```'):
              text = text.split('\n', 1)[1].rsplit('```', 1)[0]
          result = json.loads(text)

          print('Analysis:', result.get('analysis', ''))

          # Create branch and apply changes
          branch = 'fix/issue-%s' % issue
          subprocess.run(['git', 'checkout', '-b', branch], check=True)
          for f in result.get('files', []):
              path = f['path']
              content = f['content']
              os.makedirs(os.path.dirname(path) or '.', exist_ok=True)
              with open(path, 'w') as fh:
                  fh.write(content)
              subprocess.run(['git', 'add', path], check=True)

          subprocess.run(['git', 'commit', '-m', 'fix: %s (Issue #%s)' % (title[:50], issue)], check=True)
          subprocess.run(['git', 'push', 'origin', branch], check=True)

          # Open PR
          pr_body = 'Fixes #%s\n\n## Root cause\n%s\n\n## Changes\n%s' % (
              issue, result.get('analysis', ''), '\n'.join('- ' + f['path'] for f in result.get('files', []))
          )
          subprocess.run(
              ['gh', 'pr', 'create', '--repo', repo, '--title', 'fix: %s' % title, '--body', pr_body, '--base', 'master', '--head', branch],
              check=True
          )
          PYEOF
