name: AI Fixer

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  fix:
    if: contains(github.event.label.name, 'worth-fixing')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gemini fix
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import json, os, subprocess, urllib.request, urllib.error

          key = os.environ['GEMINI_API_KEY']
          issue_num = os.environ['ISSUE_NUMBER']
          repo = os.environ['REPO']

          # Fetch issue
          issue = json.loads(subprocess.run(
              ['gh', 'issue', 'view', issue_num, '--repo', repo, '--json', 'title,body', '-q', '.'],
              capture_output=True, text=True, check=True
          ).stdout)
          title = issue.get('title', '')
          body = issue.get('body', '') or ''

          # Fetch repo file list
          files = subprocess.run(
              ['gh', 'api', 'repos/%s/git/trees/HEAD?recursive=1' % repo, '-q', '.tree[].path'],
              capture_output=True, text=True, check=True
          ).stdout.strip().split('\n')
          file_list = '\n'.join(files[:200])

          prompt = (
              'You are an AI fixer. Given a GitHub issue and the repository file list, '
              'propose a minimal fix. Output a JSON object with keys: "analysis" (root cause, Chinese), '
              '"files" (array of {path, new_content}), and "test" (verification command). '
              'Only include files that need changes. Keep changes minimal.\n\n'
              'Issue #%s: %s\n\n%s\n\nRepository files (first 200):\n%s'
          ) % (issue_num, title, body[:4000], file_list)

          model = 'gemini-2.5-flash'
          url = 'https://generativelanguage.googleapis.com/v1beta/models/%s:generateContent?key=%s' % (model, key)
          req_body = {
              'contents': [{'role': 'user', 'parts': [{'text': prompt}]}],
              'generationConfig': {'temperature': 0.2, 'maxOutputTokens': 8192},
          }
          req = urllib.request.Request(url, data=json.dumps(req_body).encode(), headers={'Content-Type': 'application/json'})
          try:
              with urllib.request.urlopen(req, timeout=120) as resp:
                  data = json.load(resp)
              text = data['candidates'][0]['content']['parts'][0]['text']
          except urllib.error.HTTPError as e:
              print('Gemini API failed: %s' % e.read().decode()[:300])
              subprocess.run(['gh', 'issue', 'comment', issue_num, '--repo', repo, '--body', '🤖 AutoFix: Gemini API 调用失败，请稍后重试。'], check=True)
              raise SystemExit(1)

          # Parse JSON from response (strip markdown fences if present)
          text = text.strip()
          if text.startswith('```'):
              text = text.split('\n', 1)[1].rsplit('```', 1)[0]
          try:
              fix = json.loads(text)
          except json.JSONDecodeError:
              print('Failed to parse Gemini response: %s' % text[:500])
              subprocess.run(['gh', 'issue', 'comment', issue_num, '--repo', repo, '--body', '🤖 AutoFix: 无法解析 AI 输出，请人工处理。'], check=True)
              raise SystemExit(1)

          # Apply changes
          branch = 'fix/issue-%s' % issue_num
          subprocess.run(['git', 'checkout', '-b', branch], check=True)
          for f in fix.get('files', []):
              path = f['path']
              content = f['new_content']
              os.makedirs(os.path.dirname(path) or '.', exist_ok=True)
              with open(path, 'w', encoding='utf-8') as fh:
                  fh.write(content)
              subprocess.run(['git', 'add', path], check=True)

          # Commit and push
          subprocess.run(['git', 'commit', '-m', 'fix: %s (Issue #%s)' % (title[:60], issue_num)], check=True)
          subprocess.run(['git', 'push', 'origin', branch], check=True)

          # Open PR
          pr_body = (
              '## 根因分析\n%s\n\n## 改动\n%s\n\n## 测试\n%s\n\nFixes #%s'
          ) % (fix.get('analysis', ''), '\n'.join('- ' + f['path'] for f in fix.get('files', [])), fix.get('test', ''), issue_num)
          subprocess.run(
              ['gh', 'pr', 'create', '--repo', repo, '--base', 'master', '--head', branch,
               '--title', 'fix: %s (Issue #%s)' % (title[:60], issue_num),
               '--body', pr_body],
              check=True
          )
          print('PR created for issue #%s' % issue_num)
          PYEOF
