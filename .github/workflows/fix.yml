name: AI Fixer

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  ai-fix:
    if: contains(github.event.label.name, 'worth-fixing')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: AI Fix
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import json, os, subprocess, urllib.request, urllib.error

          key = os.environ['GEMINI_API_KEY']
          issue = os.environ['ISSUE_NUMBER']
          repo = os.environ['REPO']

          # Get issue details
          issue_data = json.loads(subprocess.run(
              ['gh', 'issue', 'view', issue, '--repo', repo, '--json', 'title,body,labels'],
              capture_output=True, text=True, check=True
          ).stdout)

          # Check if worth-fixing label exists
          labels = [l['name'] for l in issue_data['labels']]
          if 'worth-fixing' not in labels:
              print('Not worth-fixing, skipping')
              exit(0)

          title = issue_data['title']
          body = issue_data['body'] or ''

          # Clone repo
          subprocess.run(['git', 'clone', '--depth', '1', 'https://github.com/' + repo + '.git', '/tmp/repo'], check=True)
          os.chdir('/tmp/repo')

          # Get repo structure
          files = subprocess.run(['find', '.', '-type', 'f', '-not', '-path', './.git/*'], capture_output=True, text=True).stdout

          model = 'gemini-2.5-flash'
          prompt = (
              'You are an expert software engineer. Fix the issue described below.\n'
              'Repo: %s\nIssue #%s: %s\n\n%s\n\n'
              'Repo files:\n%s\n\n'
              'Steps:\n'
              '1. Analyze the issue and locate the root cause in the code.\n'
              '2. Make the minimal fix. Do not refactor unrelated code.\n'
              '3. If tests exist, add/update tests for the fix.\n'
              '4. Run tests if possible.\n'
              '5. Output the list of files you changed with full new content, and a commit message.\n'
              'Output JSON: {"files": [{"path": "...", "content": "..."}], "commit_message": "...", "pr_title": "...", "pr_body": "..."}'
          ) % (repo, issue, title, body[:5000], files[:5000])

          url = 'https://generativelanguage.googleapis.com/v1beta/models/%s:generateContent?key=%s' % (model, key)
          req_body = {
              'contents': [{'role': 'user', 'parts': [{'text': prompt}]}],
              'generationConfig': {'temperature': 0.2, 'maxOutputTokens': 16384},
          }
          req = urllib.request.Request(url, data=json.dumps(req_body).encode(), headers={'Content-Type': 'application/json'})
          try:
              with urllib.request.urlopen(req, timeout=120) as resp:
                  data = json.load(resp)
              text = data['candidates'][0]['content']['parts'][0]['text']
          except urllib.error.HTTPError as e:
              print('Gemini API failed: %s' % e.read().decode()[:300])
              exit(1)

          # Parse JSON from response (strip markdown code fences if present)
          text = text.strip()
          if text.startswith('```'):
              text = text.split('\n', 1)[1].rsplit('```', 1)[0]
          result = json.loads(text)

          # Apply changes
          branch = 'fix/issue-%s' % issue
          subprocess.run(['git', 'checkout', '-b', branch], check=True)
          for f in result['files']:
              path = f['path']
              os.makedirs(os.path.dirname(path) or '.', exist_ok=True)
              with open(path, 'w') as fh:
                  fh.write(f['content'])

          # Commit and push
          subprocess.run(['git', 'add', '-A'], check=True)
          subprocess.run(['git', 'commit', '-m', result['commit_message']], check=True)
          subprocess.run(['git', 'push', 'origin', branch], check=True)

          # Create PR
          pr_body = result['pr_body'] + '\n\nFixes #%s' % issue
          subprocess.run([
              'gh', 'pr', 'create', '--repo', repo,
              '--title', result['pr_title'],
              '--body', pr_body,
              '--head', branch,
              '--base', 'master'
          ], check=True)

          print('PR created successfully')
          PYEOF
