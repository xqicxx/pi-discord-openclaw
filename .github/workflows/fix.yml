name: AI Fixer
on:
  issues:
    types: [labeled]
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  fixer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.label.name == 'worth-fixing'
    steps:
      - uses: actions/checkout@v4
      - name: AI 分析并修复 issue
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python3 - <<PYEOF
          import json, os, subprocess, urllib.request

          repo = os.environ['REPO']
          num = os.environ['ISSUE_NUMBER']
          key = os.environ['GEMINI_API_KEY']

          def gh(*args):
              r = subprocess.run(['gh', *args, '-R', repo], capture_output=True, text=True)
              return r.stdout.strip()

          issue = json.loads(gh('issue', 'view', num, '--json', 'title,body,labels,comments'))
          comments = '\n'.join(c['body'] for c in issue['comments'])

          prompt = f'''你是资深工程师。GitHub issue 已给出，仓库已 checkout。用 bash 探索代码、定位根因、输出修复方案。

          Issue #{num}: {issue['title']}
          ---
          {issue['body'][:4000]}
          ---
          评论:
          {comments[:2000]}

          步骤：
          1. 列出关键文件: find src test -type f 2>/dev/null | head -50
          2. 阅读相关文件（cat），定位根因
          3. 输出 JSON（不要其他文字）：
          {{"root_cause": "根因", "files_to_change": ["文件"], "fix_plan": "具体改法", "tests_to_run": "验证命令", "branch": "fix/issue-N-简短", "pr_title": "标题", "pr_body": "描述"}}
          先探索再输出。'''
          body = {"contents": [{"role": "user", "parts": [{"text": prompt}]}],
                  'generationConfig': {'temperature': 0.2, 'maxOutputTokens': 4096}}
          req = urllib.request.Request(
              f'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key={key}',
              data=json.dumps(body).encode(), headers={'Content-Type': 'application/json'})
          with urllib.request.urlopen(req, timeout=180) as resp:
              data = json.load(resp)
          text = data['candidates'][0]['content']['parts'][0]['text']
          print('=== GEMINI 修复方案 ===')
          print(text)
          with open('/tmp/fix-plan.txt', 'w') as f:
              f.write(text)
          PYEOF