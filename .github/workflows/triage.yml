name: AI Triage

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  ai-triage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gemini triage
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, urllib.error, subprocess

          key = os.environ['GEMINI_API_KEY']
          repo = os.environ['REPO']
          issue_number = os.environ['ISSUE_NUMBER']

          # Fetch issue details
          issue = json.loads(subprocess.check_output(['gh', 'issue', 'view', issue_number, '--repo', repo, '--json', 'title,body,labels']))
          title = issue['title']
          body = issue.get('body') or ''

          model = 'gemini-3.6-flash'
          prompt = (
              'You are an AI triage assistant for a GitHub repository. '
              'Classify this issue into one of these categories: '
              'worth-fixing (clear bug or valuable feature with enough info), '
              'wontfix (not a bug, duplicate, or not worth fixing), '
              'needs-info (missing critical information), '
              'spam (irrelevant or promotional). '
              'Output ONLY the category word, nothing else.\n\n'
              'Issue title: %s\n\nIssue body:\n%s'
          ) % (title, body[:8000])

          url = 'https://generativelanguage.googleapis.com/v1beta/models/%s:generateContent?key=%s' % (model, key)
          req_body = {
              'contents': [{'role': 'user', 'parts': [{'text': prompt}]}],
              'generationConfig': {'temperature': 0.0, 'maxOutputTokens': 10},
          }
          req = urllib.request.Request(url, data=json.dumps(req_body).encode(), headers={'Content-Type': 'application/json'})
          try:
              with urllib.request.urlopen(req, timeout=60) as resp:
                  data = json.load(resp)
              label = data['candidates'][0]['content']['parts'][0]['text'].strip().lower()
          except Exception as e:
              label = 'needs-info'

          # Validate label
          valid = {'worth-fixing', 'wontfix', 'needs-info', 'spam'}
          if label not in valid:
              label = 'needs-info'

          # Add label to issue
          subprocess.run(['gh', 'issue', 'edit', issue_number, '--repo', repo, '--add-label', label], check=True)
          print('Labeled issue #%s as %s' % (issue_number, label))
          PYEOF
