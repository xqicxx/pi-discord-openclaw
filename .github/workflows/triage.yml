name: AI Triage

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

jobs:
  ai-triage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: AI Triage
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import json, os, subprocess, urllib.request, urllib.error

          key = os.environ['GEMINI_API_KEY']
          issue = os.environ['ISSUE_NUMBER']
          repo = os.environ['REPO']

          # Get issue details
          issue_data = json.loads(subprocess.run(
              ['gh', 'issue', 'view', issue, '--repo', repo, '--json', 'title,body,labels,comments'],
              capture_output=True, text=True, check=True
          ).stdout)

          title = issue_data['title']
          body = issue_data['body'] or ''
          comments = '\n'.join([c['body'] for c in issue_data.get('comments', [])])[:2000]

          # Get available labels
          labels = json.loads(subprocess.run(
              ['gh', 'label', 'list', '--repo', repo, '--json', 'name'],
              capture_output=True, text=True, check=True
          ).stdout)
          label_names = [l['name'] for l in labels]

          model = 'gemini-2.5-flash'
          prompt = (
              'You are a triage assistant for GitHub issues. Analyze issue #%s in repo %s.\n'
              'Title: %s\nBody: %s\nComments: %s\nAvailable labels: %s\n\n'
              'Determine:\n'
              '1. Is this spam? If yes, output {"action": "spam"}.\n'
              '2. Is there enough info? If not, output {"action": "needs-info", "comment": "..."}.\n'
              '3. Otherwise, classify: type (bug/feature/task), labels to apply, priority, complexity, risk, and whether it is worth-fixing.\n'
              'Output JSON: {"action": "triage", "type": "...", "labels": [...], "worth_fixing": true/false, "complexity": "low/medium/high", "risk": "low/medium/high", "comment": "..."}'
          ) % (issue, repo, title[:500], body[:3000], comments, ', '.join(label_names))

          url = 'https://generativelanguage.googleapis.com/v1beta/models/%s:generateContent?key=%s' % (model, key)
          req_body = {
              'contents': [{'role': 'user', 'parts': [{'text': prompt}]}],
              'generationConfig': {'temperature': 0.2, 'maxOutputTokens': 8192},
          }
          req = urllib.request.Request(url, data=json.dumps(req_body).encode(), headers={'Content-Type': 'application/json'})
          try:
              with urllib.request.urlopen(req, timeout=120) as resp:
                  data = json.load(resp)
              text = data['candidates'][0]['content']['parts'][0]['text']
          except urllib.error.HTTPError as e:
              print('Gemini API failed: %s' % e.read().decode()[:300])
              exit(1)

          text = text.strip()
          if text.startswith('```'):
              text = text.split('\n', 1)[1].rsplit('```', 1)[0]
          result = json.loads(text)

          if result['action'] == 'spam':
              subprocess.run(['gh', 'issue', 'close', issue, '--repo', repo, '--reason', 'not planned', '--comment', 'Closing as spam.'], check=True)
          elif result['action'] == 'needs-info':
              subprocess.run(['gh', 'issue', 'comment', issue, '--repo', repo, '--body', result['comment']], check=True)
              if 'needs-info' in label_names:
                  subprocess.run(['gh', 'issue', 'edit', issue, '--repo', repo, '--add-label', 'needs-info'], check=True)
          else:
              # Apply labels
              for label in result.get('labels', []):
                  if label in label_names:
                      subprocess.run(['gh', 'issue', 'edit', issue, '--repo', repo, '--add-label', label], check=True)

              if result.get('worth_fixing'):
                  if 'worth-fixing' in label_names:
                      subprocess.run(['gh', 'issue', 'edit', issue, '--repo', repo, '--add-label', 'worth-fixing'], check=True)
              else:
                  if 'wontfix' in label_names:
                      subprocess.run(['gh', 'issue', 'edit', issue, '--repo', repo, '--add-label', 'wontfix'], check=True)
                  subprocess.run(['gh', 'issue', 'close', issue, '--repo', repo, '--reason', 'not planned'], check=True)

              # Add triage comment
              comment = result.get('comment', '')
              subprocess.run(['gh', 'issue', 'comment', issue, '--repo', repo, '--body', comment], check=True)

          print('Triage complete')
          PYEOF
