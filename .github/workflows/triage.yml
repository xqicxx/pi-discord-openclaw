name: AI Triage

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run AI triage
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import json, os, subprocess, urllib.request, urllib.error

          key = os.environ['GEMINI_API_KEY']
          issue = os.environ['ISSUE_NUMBER']
          repo = os.environ['REPO']

          issue_data = json.loads(subprocess.run(
              ['gh', 'issue', 'view', issue, '--repo', repo, '--json', 'title,body'],
              capture_output=True, text=True, check=True
          ).stdout)
          title = issue_data['title']
          body = issue_data['body']

          model = 'gemini-2.5-flash'
          prompt = (
              'You are a triage bot. Classify this GitHub issue into one of: '
              'worth-fixing, wontfix, needs-info, spam.\n\n'
              'Issue #%s: %s\n\n%s\n\n'
              'Output JSON: {"label": "...", "reason": "..."}'
          ) % (issue, title, body)

          url = 'https://generativelanguage.googleapis.com/v1beta/models/%s:generateContent?key=%s' % (model, key)
          req_body = {
              'contents': [{'role': 'user', 'parts': [{'text': prompt}]}],
              'generationConfig': {'temperature': 0.2, 'maxOutputTokens': 1024},
          }
          req = urllib.request.Request(url, data=json.dumps(req_body).encode(), headers={'Content-Type': 'application/json'})
          try:
              with urllib.request.urlopen(req, timeout=60) as resp:
                  data = json.load(resp)
              text = data['candidates'][0]['content']['parts'][0]['text']
          except urllib.error.HTTPError as e:
              print('Gemini API error:', e.code, e.read().decode()[:500])
              raise

          text = text.strip()
          if text.startswith('```'):
              text = text.split('\n', 1)[1].rsplit('```', 1)[0]
          result = json.loads(text)
          label = result.get('label', 'needs-info')
          reason = result.get('reason', '')

          # Add label and comment
          subprocess.run(['gh', 'issue', 'edit', issue, '--repo', repo, '--add-label', label], check=True)
          subprocess.run(
              ['gh', 'issue', 'comment', issue, '--repo', repo, '--body', '🤖 **AI Triage**: %s\n\n%s' % (label, reason)],
              check=True
          )
          PYEOF
