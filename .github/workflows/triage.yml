name: AI Triage

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gemini triage
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, urllib.error

          key = os.environ['GEMINI_API_KEY']
          issue_num = os.environ['ISSUE_NUMBER']
          repo = os.environ['REPO']

          # Fetch issue details
          import subprocess
          issue = json.loads(subprocess.run(
              ['gh', 'issue', 'view', issue_num, '--repo', repo, '--json', 'title,body,labels', '-q', '.'],
              capture_output=True, text=True, check=True
          ).stdout)

          title = issue.get('title', '')
          body = issue.get('body', '') or ''
          labels = [l['name'] for l in issue.get('labels', [])]

          prompt = (
              'You are a triage bot. Classify this GitHub issue into one of: '
              'worth-fixing, wontfix, needs-info, spam. '
              'Reply with ONLY the classification word.\n\n'
              'Title: %s\nBody:\n%s\nExisting labels: %s'
          ) % (title, body[:4000], ', '.join(labels))

          model = 'gemini-2.5-flash'
          url = 'https://generativelanguage.googleapis.com/v1beta/models/%s:generateContent?key=%s' % (model, key)
          req_body = {
              'contents': [{'role': 'user', 'parts': [{'text': prompt}]}],
              'generationConfig': {'temperature': 0.0, 'maxOutputTokens': 10},
          }
          req = urllib.request.Request(url, data=json.dumps(req_body).encode(), headers={'Content-Type': 'application/json'})
          try:
              with urllib.request.urlopen(req, timeout=60) as resp:
                  data = json.load(resp)
              verdict = data['candidates'][0]['content']['parts'][0]['text'].strip().lower()
          except urllib.error.HTTPError as e:
              verdict = 'needs-info'
              print('Gemini API error: %s' % e.read().decode()[:200])

          # Normalize verdict
          if verdict not in ('worth-fixing', 'wontfix', 'needs-info', 'spam'):
              verdict = 'needs-info'

          # Apply label
          subprocess.run(['gh', 'issue', 'edit', issue_num, '--repo', repo, '--add-label', verdict], check=True)
          print('Applied label: %s' % verdict)
          PYEOF
